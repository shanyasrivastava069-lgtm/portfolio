<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: rgba(0,0,13);
            color:white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-wrapper {
            background: #ffffff;
            display: flex;
            /* row-reverse forces the second HTML element (the form) to the right */
            flex-direction: row-reverse; 
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }

        /* Left Side Info Section */
        .info-side {
            background-color: rgb(94, 94, 229);;
            color: white;
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-side h2 {
            font-size: 28px;
            margin-bottom: 16px;
        }

        .info-side p {
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* Right Side Form Section */
        .form-side {
            flex: 1;
            padding: 40px;
            background: #ffffff;
        }

        .form-side h2 {
            margin-bottom: 20px;
            color: #333333;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555555;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            width: 100%;
            background-color: rgb(94, 94, 229);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: rgb(161, 77, 231);
        }

        /* Responsive layout for smaller screens */
        @media (max-width: 768px) {
            .contact-wrapper {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="contact-wrapper">
        
        <div class="info-side">
            <h2>Let's Talk</h2>
            <p>We would love to hear from you. Fill out the form and our team will get back to you within 24 hours.</p>
        </div>

        <div class="form-side">
            <h2>Contact Us</h2>
            <<form action="https://api.web3forms.com/submit" method="POST">  
                  <input type="hidden" name="access_key" value="4a07a2a1-52f5-4c9d-81ea-59dff75decc3">  
                <div class="form-group">
                   
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type your message here..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit</button>
                
            </form>
        </div>

    </div>

</body>
</html>
